<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ isLoggedIn ? 'Welcome Back' : 'Welcome' }}</ion-card-title>
        <ion-card-subtitle>{{ isLoggedIn ? 'You are logged in' : 'Please log in to continue' }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" (click)="toggleAuth()">
          {{ isLoggedIn ? 'Logout' : 'Login' }}
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
