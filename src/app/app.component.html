<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Navigation</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list lines="none">
          <ion-list-header>Messages</ion-list-header>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/inbox']" routerLinkActive="selected" detail="false">
              <ion-icon slot="start" name="mail-outline"></ion-icon>
              <ion-label>Inbox</ion-label>
            </ion-item>
          </ion-menu-toggle>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/sent']" routerLinkActive="selected" detail="false">
              <ion-icon slot="start" name="send-outline"></ion-icon>
              <ion-label>Sent Messages</ion-label>
            </ion-item>
          </ion-menu-toggle>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/trash']" routerLinkActive="selected" detail="false">
              <ion-icon slot="start" name="trash-outline"></ion-icon>
              <ion-label>Trash</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
